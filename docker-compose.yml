version: '3.8'
services:
  backend:
    build: .
    container_name: matcha_backend_api
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis_broker:6379/0
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      - redis_broker
    networks:
      - matcha_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis_broker:
    image: redis:7-alpine
    container_name: matcha_redis_broker
    ports:
      - "6379:6379"
    networks:
      - matcha_network

  worker:
    build: .
    container_name: matcha_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis_broker:6379/0
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      - redis_broker
    networks:
      - matcha_network

  prometheus:
    image: prom/prometheus:latest
    container_name: matcha_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - matcha_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: matcha_frontend_ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/recommend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - matcha_network
volumes:
  chroma_data:
networks:
  matcha_network:
    driver: bridge
